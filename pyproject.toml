[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geokz"
version = "0.1.0"
description = "Доказательный геологический справочник Казахстана"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "GeoKZ" }]
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.34,<1.0",
    "SQLAlchemy[asyncio]>=2.0.51,<2.1",
    "alembic>=1.18.5,<1.19",
    "asyncpg>=0.31,<0.32",
    "GeoAlchemy2>=0.17,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.11,<1.0",
]
desktop = [
    "PySide6>=6.8,<7.0",
]
windows-build = [
    "pyinstaller>=6.13,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
