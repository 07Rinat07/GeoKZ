services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geokz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geokz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_real_use}
      POSTGRES_DB: ${POSTGRES_DB:-geokz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geokz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geokz} -d ${POSTGRES_DB:-geokz}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geokz-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GEOKZ_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-geokz}:${POSTGRES_PASSWORD:-change_me_for_real_use}@db:5432/${POSTGRES_DB:-geokz}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  external-sync-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geokz-external-sync-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GEOKZ_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-geokz}:${POSTGRES_PASSWORD:-change_me_for_real_use}@db:5432/${POSTGRES_DB:-geokz}
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "scripts.external_sync_scheduler"]

volumes:
  geokz_postgres_data:
